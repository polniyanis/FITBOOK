<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In · GTG Fitness</title>
<meta name="description" content="Log in to your GTG Fitness account to access the system." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body class="fixed-page login-page">

<div class="page">

  <header class="site-header">
    <a href="index.html" class="site-header__logo">GTG FITNESS</a>
  </header>

  <div class="auth-layout">

    <main class="auth-panel">
      <div class="auth-form-wrap">

        <h1 class="auth-title">LOG IN TO <span>GTG FITNESS</span></h1>
        <p class="auth-subtitle">Access the system by logging in here.</p>

        <form class="auth-form" id="loginForm" novalidate>

          <div class="field">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m2 6 10 7 10-7"></path>
            </svg>
            <label for="email" class="visually-hidden">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
          </div>

          <div class="field field--toggle">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="4" y="10" width="16" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="field__toggle-btn" aria-label="Show password" data-toggle-password="password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <p class="form-error" id="formError" role="alert"></p>

          <p class="form-links"><a href="#forgot-password">Forgot your password?</a></p>

          <div class="btn-row">
            <a href="#back" class="btn btn-outline">Back</a>
            <button type="submit" class="btn btn-solid">Log In</button>
          </div>

        </form>

        <p class="form-footnote">Don't have an account yet? <a href="signup.html">Sign Up</a></p>

      </div>
    </main>

    <aside class="auth-visual" aria-label="GTG Fitness gym">
      <img
        src="https://i.pinimg.com/1200x/ef/2d/33/ef2d33d16b590a389d17949ab1b0b7eb.jpg"
        referrerpolicy="no-referrer"
        alt="A trainer coaching a woman through dumbbell lateral raises in the gym" />

      <ul class="visual-contact">
        
        <li>
      <a href="https://www.facebook.com/p/GTG-Fitness-61572973704677/" class="social-link" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
  GTG FITNESS
</a>
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L14 12l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 4 5a2 2 0 0 1 2-2Z"/></svg>
          09175462414
        </li>
      </ul>

      <span class="visual-eye" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
    </aside>

  </div>
</div>

<script>
   document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.getAttribute('data-toggle-password'));
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  });

  
  document.getElementById('loginForm').addEventListener('submit', function (event) {
  event.preventDefault();
  document.getElementById('formError').classList.remove('is-visible');
  document.querySelectorAll('.field').forEach(function (f) { f.classList.remove('has-error'); });

  const emailInput = document.getElementById('email').value.trim();
  const passwordInput = document.getElementById('password').value;

  
  var err = document.getElementById('formError');
  function showError(msg, inputs) {
    err.textContent = msg;
    err.classList.add('is-visible');
    inputs.forEach(function (i) { i.closest('.field').classList.add('has-error'); });
    inputs[0].focus();
  }
  var emailEl = document.getElementById('email');
  var passEl  = document.getElementById('password');

  if (!emailInput)                  { return showError('Please enter your email first.', [emailEl]); }
  if (!emailEl.checkValidity())     { return showError('That email doesn\u2019t look right. Please check it.', [emailEl]); }
  if (!passwordInput)               { return showError('Please enter your password.', [passEl]); }

  const validUsers = [
    { email: 'member1@gmail.com', password: 'member', dashboard: 'memberdashboard.html' },
    { email: 'trainer1@gmail.com', password: 'trainer', dashboard: 'trainerdashboard.html' },
    { email: 'admin1@gmail.com', password: 'admin', dashboard: 'admindashboard.html' }
  ];

 
  const foundUser = validUsers.find(
    user => user.email === emailInput && user.password === passwordInput
  );

  if (foundUser) {
    
    localStorage.setItem('currentUser', JSON.stringify({ email: foundUser.email }));
    
    
    window.location.href = foundUser.dashboard;
  } else {
    showError('Incorrect email or password. Please try again.', [emailEl, passEl]);
  }
});
</script>

</body>
</html>
