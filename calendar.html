<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar · GTG Fitness</title>
<meta name="description" content="Browse available classes by date at GTG Fitness." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="app.css" />
</head>
<body>

<div class="app-shell">

  <header class="app-topbar">
    <a href="dashboard.html" class="app-topbar__logo">GTG FITNESS</a>
    <details class="settings-menu">
      <summary class="app-topbar__settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.32.44.55.8.66.34.11.65.36.8.66"></path>
        </svg>
      </summary>
      <div class="settings-panel">
        <div class="settings-panel__profile">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=100&q=80" alt="" />
          <div>
            <p class="settings-panel__profile-name">Madriaga, Rafaela</p>
            <p class="settings-panel__profile-sub">Member</p>
          </div>
        </div>
        <a href="edit-profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          Edit Profile
        </a>
        <div class="settings-panel__divider"></div>
        <a href="index.html" class="settings-panel__logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
          Log Out
        </a>
      </div>
    </details>
  </header>

  <nav class="app-sidebar" aria-label="Main navigation">
    <ul class="app-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li class="is-active"><a href="calendar.html" aria-current="page">Calendar</a></li>
      <li><a href="classes.html">Classes</a></li>
      <li><a href="trainers.html">Trainers</a></li>
      <li><a href="achievements.html">Achievements</a></li>
      <li><a href="feedback.html">Feedback</a></li>
    </ul>
  </nav>

  <main class="app-main">
    <h1 class="page-title">Available Classes!</h1>

    <div class="calendar-layout">
      <section class="card big-calendar-card" aria-labelledby="cal-month">
        <label for="month-select" class="visually-hidden">Select month</label>
        <select id="month-select" class="select-native">
          <option selected>May 2026</option>
          <option>June 2026</option>
          <option>July 2026</option>
        </select>

        <div class="big-calendar" role="table" aria-label="May 2026">
          <span class="big-calendar__head">Sun</span>
          <span class="big-calendar__head">Mon</span>
          <span class="big-calendar__head">Tue</span>
          <span class="big-calendar__head">Wed</span>
          <span class="big-calendar__head">Thurs</span>
          <span class="big-calendar__head">Fri</span>
          <span class="big-calendar__head">Sat</span>

          <button type="button" class="big-calendar__cell">1</button>
          <button type="button" class="big-calendar__cell">2</button>
          <button type="button" class="big-calendar__cell">3</button>
          <button type="button" class="big-calendar__cell">4</button>
          <button type="button" class="big-calendar__cell">5</button>
          <button type="button" class="big-calendar__cell">6</button>
          <button type="button" class="big-calendar__cell">7</button>

          <button type="button" class="big-calendar__cell">8</button>
          <button type="button" class="big-calendar__cell">9</button>
          <button type="button" class="big-calendar__cell">10</button>
          <button type="button" class="big-calendar__cell">11</button>
          <button type="button" class="big-calendar__cell">12</button>
          <button type="button" class="big-calendar__cell">13</button>
          <button type="button" class="big-calendar__cell">14</button>

          <button type="button" class="big-calendar__cell">15</button>
          <button type="button" class="big-calendar__cell">16</button>
          <button type="button" class="big-calendar__cell">17</button>
          <button type="button" class="big-calendar__cell">18</button>
          <button type="button" class="big-calendar__cell">19</button>
          <button type="button" class="big-calendar__cell">20</button>
          <button type="button" class="big-calendar__cell">21</button>

          <button type="button" class="big-calendar__cell">22</button>
          <button type="button" class="big-calendar__cell">23</button>
          <button type="button" class="big-calendar__cell">24</button>
          <button type="button" class="big-calendar__cell">25</button>
          <button type="button" class="big-calendar__cell">26</button>
          <button type="button" class="big-calendar__cell">27</button>
          <button type="button" class="big-calendar__cell">28</button>

          <button type="button" class="big-calendar__cell">29</button>
          <button type="button" class="big-calendar__cell">30</button>
          <button type="button" class="big-calendar__cell">31</button>
          <span class="big-calendar__cell"></span>
          <span class="big-calendar__cell"></span>
          <span class="big-calendar__cell"></span>
          <span class="big-calendar__cell"></span>
        </div>
      </section>

      <p class="select-date-note">Select a Date</p>
    </div>
  </main>

</div>


<script>
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.settings-menu[open]').forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
</script>
</body>
</html>
