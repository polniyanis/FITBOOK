<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edit Profile · GTG Fitness</title>
<meta name="description" content="Update your GTG Fitness member profile." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="app.css" />
</head>
<body>

<div class="app-shell">

  <header class="app-topbar">
    <a href="dashboard.html" class="app-topbar__logo">GTG FITNESS</a>
    <details class="settings-menu">
      <summary class="app-topbar__settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.32.44.55.8.66.34.11.65.36.8.66"></path>
        </svg>
      </summary>
      <div class="settings-panel">
        <div class="settings-panel__profile">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=100&q=80" alt="" />
          <div>
            <p class="settings-panel__profile-name">Madriaga, Rafaela</p>
            <p class="settings-panel__profile-sub">Member</p>
          </div>
        </div>
        <a href="edit-profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
          Edit Profile
        </a>
        <div class="settings-panel__divider"></div>
        <a href="index.html" class="settings-panel__logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
          Log Out
        </a>
      </div>
    </details>
  </header>

  <nav class="app-sidebar" aria-label="Main navigation">
    <ul class="app-nav">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="calendar.html">Calendar</a></li>
      <li><a href="classes.html">Classes</a></li>
      <li><a href="trainers.html">Trainers</a></li>
      <li><a href="achievements.html">Achievements</a></li>
      <li><a href="feedback.html">Feedback</a></li>
    </ul>
  </nav>

  <main class="app-main">
    <h1 class="page-title">Edit Profile</h1>
    <p class="page-subtitle">Keep your personal information up to date.</p>

    <div class="edit-profile-layout">

      <section class="card edit-profile-photo-card" aria-labelledby="photo-heading">
        <h2 id="photo-heading" class="card-heading">Profile Photo</h2>
        <div class="edit-profile-photo">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80" alt="Current profile photo" id="avatar-preview" />
          <div class="edit-profile-photo__actions">
            <label for="avatar-upload" class="btn btn-navy btn-block">Upload New Photo</label>
            <input type="file" id="avatar-upload" accept="image/*" class="visually-hidden" />
            <button type="button" class="btn btn-outline-plain btn-block">Remove Photo</button>
          </div>
          <p class="edit-profile-photo__hint">JPG or PNG. Max size 5MB.</p>
        </div>
      </section>

      <section class="card edit-profile-form-card" aria-labelledby="details-heading">
        <h2 id="details-heading" class="card-heading">Personal Details</h2>

        <form class="edit-profile-form">

          <div class="form-row">
            <div class="form-field">
              <label for="first-name">First Name</label>
              <input type="text" id="first-name" name="first-name" value="Rafaela" autocomplete="given-name" />
            </div>
            <div class="form-field">
              <label for="last-name">Last Name</label>
              <input type="text" id="last-name" name="last-name" value="Madriaga" autocomplete="family-name" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" value="rafaela.madriaga@email.com" autocomplete="email" />
            </div>
            <div class="form-field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" value="0917 123 4567" autocomplete="tel" />
            </div>
          </div>

          <div class="form-row form-row--three">
            <div class="form-field">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" value="17" min="0" />
            </div>
            <div class="form-field">
              <label for="height">Height</label>
              <input type="text" id="height" name="height" value="6'1" />
            </div>
            <div class="form-field">
              <label for="weight">Weight</label>
              <input type="text" id="weight" name="weight" value="65 kg" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" class="select-native">
                <option>Female</option>
                <option>Male</option>
                <option>Prefer not to say</option>
              </select>
            </div>
            <div class="form-field">
              <label for="birthdate">Birthdate</label>
              <input type="date" id="birthdate" name="birthdate" />
            </div>
          </div>

          <div class="form-field">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Street, Barangay, City" autocomplete="street-address" />
          </div>

          <hr class="form-divider" />

          <h3 class="form-section-title">Change Password</h3>

          <div class="form-row">
            <div class="form-field">
              <label for="new-password">New Password</label>
              <input type="password" id="new-password" name="new-password" placeholder="Leave blank to keep current password" autocomplete="new-password" />
            </div>
            <div class="form-field">
              <label for="confirm-password">Confirm New Password</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter new password" autocomplete="new-password" />
            </div>
          </div>

          <div class="form-actions">
            <a href="dashboard.html" class="btn btn-outline-plain">Cancel</a>
            <button type="submit" class="btn btn-navy">Save Changes</button>
          </div>

        </form>
      </section>

    </div>
  </main>

</div>

<script>
  document.getElementById('avatar-upload').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      document.getElementById('avatar-preview').src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
</script>

<script>
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.settings-menu[open]').forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
</script>
</body>
</html>
